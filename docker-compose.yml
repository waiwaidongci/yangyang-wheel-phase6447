name: yangyang-wheel-phase

x-app: &app
  image: yangyang-wheel-phase-app:local
  environment:
    DATABASE_URL: "postgresql+psycopg://workbench:demo-db-local@db:5432/workbench"
    REDIS_URL: "redis://redis:6379/0"
    JWT_SECRET: "${JWT_SECRET:-demo-signing-key-local-only-setup}"
    SEED_DEMO: "${SEED_DEMO:-true}"
  volumes: ["reports:/artifacts"]
  restart: unless-stopped

services:
  backend:
    <<: *app
    build: ./backend
    container_name: "${COMPOSE_PROJECT_NAME:-yangyang-wheel-phase}-backend"
    ports: ["127.0.0.1:${BACKEND_PORT:-19430}:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 35
  worker:
    <<: *app
    pull_policy: never
    command: ["python", "-m", "src.worker"]
    container_name: "${COMPOSE_PROJECT_NAME:-yangyang-wheel-phase}-worker"
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.check_worker"]
      interval: 2s
      timeout: 3s
      retries: 25
  db:
    container_name: "${COMPOSE_PROJECT_NAME:-yangyang-wheel-phase}-db"
    ports: ["127.0.0.1:${DB_PORT:-17930}:5432"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: demo-db-local
      POSTGRES_DB: workbench
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 2s
      timeout: 3s
      retries: 50
  redis:
    image: redis:7-alpine
    container_name: "${COMPOSE_PROJECT_NAME:-yangyang-wheel-phase}-redis"
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 25

volumes:
  database:
  redis-data:
  reports:
